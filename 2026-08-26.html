  });
  document.getElementById('gap-rows').innerHTML = gapHTML;

  // 模块七 情景 Tab 按钮 + 面板
  var order = ['bull','base','bear'];
  var labels = { bull:'🟢 BULL', base:'🟡 BASE', bear:'🔴 BEAR' };
  var colors = { bull:'#10B981', base:'#F59E0B', bear:'#EF4444' };
  var bgMap = { bull:'#F4FAF5', base:'#FDFAF1', bear:'#FDF6F5' };
  var bdMap = { bull:'#CFE3D3', base:'#ECD9A8', bear:'#F0C4BD' };
  var btnHTML = '', panHTML = '';
  order.forEach(function(k, i){
    btnHTML += '<button class="tab-btn px-3 py-1.5 rounded-lg text-[13px] font-bold text-white" style="background:'+colors[k]+';opacity:'+(i===0?'1':'0.55')+';" data-target="tab-'+k+'" onclick="switchTab(this)">'+labels[k]+'</button>';
  });
  order.forEach(function(k, i){
    var s = DATA.gap.scenarios[k];
    panHTML += '<div id="tab-'+k+'" class="tab-panel '+(i===0?'active':'')+' mt-2 rounded-lg p-3 text-[13px]" style="background:'+bgMap[k]+';border:1px solid '+bdMap[k]+';">'+kindBadge('Hypothesis')+' <b class="text-'+k+'">'+s.title+'</b><br>触发：'+s.trigger+'<br>结果：'+s.result+'<br>概率：'+s.prob+'<br>结构距离：'+s.rr+' '+refsHTML(s.refs)+'</div>';
  });
  document.getElementById('scenario-btns').innerHTML = btnHTML;
  document.getElementById('scenario-panels').innerHTML = panHTML;
  document.getElementById('gap-deepdive').style.display = 'none';

  // 长期估值中枢
  var valuation = DATA.decision.valuation;
  var flHTML = '<div class="flex flex-wrap items-center gap-2">'+kindBadge(valuation.kind)+'<b class="text-bear">'+valuation.status+'</b>'+refsHTML(valuation.refs)+'</div><div class="text-xl font-bold mt-2" style="color:#5B4312;">'+valuation.value+'</div>';
  document.getElementById('flow-four').innerHTML = flHTML;
  document.getElementById('flow-concl').innerHTML = valuation.explanation;
  document.getElementById('flow-table').innerHTML = '<div><b>建立条件</b><br>'+valuation.requirement+'</div>';
  document.getElementById('flow-gap').textContent = '';

  // 证据账本
  document.getElementById('narrative-bar').innerHTML = '<div class="text-[11.5px]">点击证据编号查看数值、日期、抓取时间、来源与质量。</div>';
  document.getElementById('narrative-phase').innerHTML = '<div id="evidence-detail" class="rounded-lg p-2.5" style="background:#FFFCF7;border:1px solid #ECD9A8;"></div>';
  var niHTML = '';
  DATA.decision.evidence.forEach(function(it){
    niHTML += '<button type="button" class="w-full text-left flex items-center justify-between gap-2 py-1 border-b" style="border-color:#E8E3D8;" onclick="showEvidence(\''+it.id+'\')"><span>'+kindBadge(it.kind)+' <b>'+it.id+' · '+it.metric+'</b></span><span class="text-[10.5px]" style="color:#6B7280;">'+it.quality+'</span></button>';
  });
  document.getElementById('narrative-items').innerHTML = niHTML;

  // 模块八 催化剂倒计时 + 时间轴 + Top3
  document.getElementById('countdown-label').textContent = '距 ' + DATA.catalyst.targetLabel;
  var tlHTML = '';
  DATA.catalyst.timeline.forEach(function(t){
    tlHTML += '<div class="flex gap-2"><span class="text-'+t.cls+' font-bold">'+t.period+'</span><span>'+kindBadge(t.kind)+' '+t.items+' '+refsHTML(t.refs)+'</span></div>';
  });
  document.getElementById('catalyst-timeline').innerHTML = tlHTML;
  var clusterHTML = '<div class="rounded-lg p-2.5" style="background:#FFFCF7;border:1px solid #ECD9A8;">'
    + '<b class="block text-[12.5px]" style="color:#5B4312;">'+DATA.catalyst.clusterTitle+'</b>'
    + '<p class="text-[11.5px] mt-1">'+DATA.catalyst.clusterLogic+'</p>'
    + '<div class="coll-toggle mt-2 text-[11.5px] font-bold" style="color:#8A6D2F;" onclick="toggleColl(this)"><span class="chev">▶</span> 展开事件路径与非对称风险</div>'
    + '<div class="coll mt-2 text-[11.5px]">';
  (DATA.catalyst.clusterEvents || []).forEach(function(ev, i){
    clusterHTML += '<div class="analysis-step"><div>'+kindBadge('Fact')+' <span class="analysis-tag">'+ev.role+'</span> <b>'+ev.name+'</b></div>'
      + '<p class="mt-1">'+kindBadge('Hypothesis')+' <b class="text-bull">偏多意外：</b>'+ev.bullish+'</p>'
      + '<p>'+kindBadge('Hypothesis')+' <b class="text-bear">偏空意外：</b>'+ev.bearish+'</p>'
      + '<p class="text-[10.5px] mt-1" style="color:#6B7280;">来源：'+ev.source+'</p></div>';
  });
  if(DATA.catalyst.asymmetry){
    clusterHTML += '<div class="analysis-step">'+kindBadge('Inference')+' <span class="analysis-tag">非对称性</span><p class="mt-1">'+DATA.catalyst.asymmetry+' '+refsHTML(['F2','F3','F4','F10'])+'</p></div>';
  }
  clusterHTML += '</div></div>';
  document.getElementById('catalyst-cluster').innerHTML = clusterHTML;
  var t3HTML = '';
  DATA.catalyst.top3.forEach(function(t){
    t3HTML += '<div class="flex items-start gap-2"><span class="text-bear font-bold w-8">'+t.w+'</span><span>'+kindBadge(t.kind)+' '+t.text+' '+refsHTML(t.refs)+'</span></div>';
  });
  document.getElementById('top3').innerHTML = t3HTML;

  // 手机端保持三栏信息架构，用分页切换避免横向压缩
  var dashboard = document.getElementById('dashboard-grid');
  var columnButtons = document.querySelectorAll('.mobile-column-nav button');
  columnButtons.forEach(function(button){
    button.addEventListener('click', function(){
      var target = document.getElementById(button.getAttribute('data-column'));
      if(!target || !dashboard) return;
      dashboard.scrollTo({left:target.offsetLeft - dashboard.offsetLeft,behavior:'smooth'});
      columnButtons.forEach(function(item){ item.classList.toggle('active', item === button); });
    });
  });
  if(dashboard){
    dashboard.addEventListener('scroll', function(){
      if(window.innerWidth >= 1024) return;
      var nearest = 0;
      var distance = Infinity;
      ['column-summary','column-research','column-monitor'].forEach(function(id, index){
        var node = document.getElementById(id);
        var nextDistance = Math.abs((node.offsetLeft - dashboard.offsetLeft) - dashboard.scrollLeft);
        if(nextDistance < distance){ distance = nextDistance; nearest = index; }
      });
      columnButtons.forEach(function(item, index){ item.classList.toggle('active', index === nearest); });
    }, {passive:true});
  }

  // 免责声明
  document.getElementById('disclaimer-text').textContent = DATA.disclaimer;

  // ===== 交互函数 =====
  window.toggleColl = function(el){
    el.classList.toggle('open');
    var body = el.nextElementSibling;
    if(body && body.classList.contains('coll')){ body.classList.toggle('open'); }
  };
  window.switchTab = function(btn){
    var group = btn.parentElement;
    group.querySelectorAll('.tab-btn').forEach(function(b){ b.style.opacity = '0.55'; });
    btn.style.opacity = '1';
    var targetId = btn.getAttribute('data-target');
    var section = group.parentElement;
    section.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    var t = document.getElementById(targetId);
    if(t) t.classList.add('active');
  };
  window.showEvidence = function(id){
    var item = evidenceMap[id];
    if(!item) return;
    var target = document.getElementById('evidence-detail');
    if(!target) return;
    target.innerHTML = '<div class="flex items-center justify-between gap-2">'+kindBadge(item.kind)+'<b>'+item.id+' · '+item.metric+'</b></div>'
      + '<div class="text-lg font-bold mt-1" style="color:#5B4312;">'+item.value+'</div>'
      + '<div class="mt-1 text-[11px]"><b>数据日期：</b>'+item.asOf+'<br><b>抓取时间：</b>'+item.retrieved+'<br><b>来源：</b>'+item.source+'<br><b>质量：</b>'+item.quality+'<br><b>使用边界：</b>'+item.note+'</div>';
  };
  if(DATA.decision.evidence.length){ window.showEvidence(DATA.decision.evidence[0].id); }

  // ===== 倒计时 =====
  function tickCountdown(){
    var target = new Date(DATA.catalyst.targetISO).getTime();
    var now = Date.now();
    var diff = target - now;
    if(diff < 0){ document.getElementById('countdown').textContent = '已开始'; return; }
    var d = Math.floor(diff/86400000);
    var h = Math.floor(diff%86400000/3600000);
    var m = Math.floor(diff%3600000/60000);
    document.getElementById('countdown').textContent = d + '天 ' + h + '时 ' + m + '分';
  }
  tickCountdown();
  setInterval(tickCountdown, 60000);

  // ===== ECharts K线 =====
  var closes = DATA.tech.ohlc.map(function(d){ return d[1]; });
  function calcMA(n){
    var r = [];
    for(var i=0;i<closes.length;i++){
      if(i<n-1){ r.push('-'); }
      else{ var s=0; for(var j=0;j<n;j++){ s+=closes[i-j]; } r.push(+(s/n).toFixed(1)); }
    }
    return r;
  }
  var kline = echarts.init(document.getElementById('kline'));
  var maLines = [
    { name:'MA5',  n:5,  c:'#C9A24B' },
    { name:'MA10', n:10, c:'#4A7DBD' },
    { name:'MA20', n:20, c:'#8A6D2F' }
  ];
  var kSeries = [
    { name:'日K', type:'candlestick', data:DATA.tech.ohlc,
      itemStyle:{ color:'#EF4444', color0:'#10B981', borderColor:'#EF4444', borderColor0:'#10B981' },
      markArea:{ silent:true, data:[
        [ { name:'压力区', yAxis:DATA.tech.pressureZone.from, itemStyle:{color:'rgba(239,68,68,0.06)'} }, { yAxis:DATA.tech.pressureZone.to } ],
        [ { name:'支撑区', yAxis:DATA.tech.supportZone.from,  itemStyle:{color:'rgba(16,185,129,0.08)'} }, { yAxis:DATA.tech.supportZone.to } ],
        [ { name:'事件起点', yAxis:DATA.tech.invalidationZone.from, itemStyle:{color:'rgba(239,68,68,0.05)'} }, { yAxis:DATA.tech.invalidationZone.to } ]
      ]},
      markLine:{ silent:true, symbol:'none', label:{ color:'#8A6D2F', fontSize:9, position:'insideEndTop' },
        data: DATA.tech.markLines.map(function(m){ return { yAxis:m.y, name:m.name, lineStyle:{ color:m.color, type:'dashed' } }; }) }
    }
  ];
  var eventSeries = { name:'事件节点', type:'scatter', symbol:'circle', z:8,
    itemStyle:{ color:'#C9A24B', borderColor:'#FFFFFF', borderWidth:2 },
    label:{ position:'top', color:'#8A6D2F', fontSize:9 },
    data:[]
  };
  function eventSeriesData(selectedIndex){
    return (DATA.tech.events || []).filter(function(ev){ return ev.index >= 0 && ev.price !== null; }).map(function(ev){
      var selected = DATA.tech.events.indexOf(ev) === selectedIndex;
      return { value:[ev.index, ev.price], name:ev.label, label:{show:selected, formatter:ev.label}, symbolSize:selected ? 18 : 10, itemStyle:{color:selected ? '#8A6D2F' : '#C9A24B', borderColor:'#FFFFFF', borderWidth:2} };
    });
  }
  kSeries.push(eventSeries);
  maLines.forEach(function(ma){
    kSeries.push({ name:ma.name, type:'line', data:calcMA(ma.n), smooth:true, showSymbol:false, lineStyle:{ width:1, color:ma.c } });
  });
  kline.setOption({
    tooltip:{ trigger:'axis', axisPointer:{ type:'cross' } },
    legend:{ data:['日K','MA5','MA10','MA20'], top:0 },
    grid:{ left:48, right:16, top:30, bottom:28 },
    xAxis:{ type:'category', data:DATA.tech.dates, boundaryGap:true },
    yAxis:{ scale:true },
    dataZoom:[{ type:'inside', start:15, end:100 }],
    series: kSeries
  });

  window.selectEvent = function(index){
    var ev = (DATA.tech.events || [])[index];
    if(!ev) return;
    document.querySelectorAll('.event-card').forEach(function(card){ card.classList.toggle('active', Number(card.getAttribute('data-event-index')) === index); });
    document.getElementById('event-summary').innerHTML = eventSummaryHTML(ev);
    eventSeries.data = eventSeriesData(index);
    kline.setOption({series:kSeries});
  };
  if((DATA.tech.events || []).length){ window.selectEvent((DATA.tech.events || []).length - 1); }

  // ===== ECharts 核心驱动权重 =====
  var radar = echarts.init(document.getElementById('radar'));
  radar.setOption({
    tooltip:{ formatter:function(p){ var d=DATA.decision.drivers[p.dataIndex]; return '<b>'+d.name+'</b><br>解释权重 '+d.weight+'%<br>方向 '+d.direction+'<br>'+d.evidence; } },
    grid:{left:112,right:34,top:12,bottom:24},
    xAxis:{type:'value',max:100,axisLabel:{formatter:'{value}%'},splitLine:{lineStyle:{color:'#EEEAE2'}}},
    yAxis:{type:'category',inverse:true,data:DATA.decision.drivers.map(function(d){return d.name;}),axisTick:{show:false},axisLine:{show:false},axisLabel:{color:'#5B4312',fontSize:11}},
    series:[{type:'bar',barWidth:14,data:DATA.decision.drivers.map(function(d){return {value:d.weight,itemStyle:{color:d.direction==='偏空'?'#EF4444':d.direction==='偏多'?'#10B981':'#F59E0B',borderRadius:[0,3,3,0]},label:{show:true,position:'right',formatter:d.weight+'% · '+d.direction,color:'#5B4312',fontSize:10}};})}]
  });
  radar.on('click',function(params){ window.showDriver(params.dataIndex); });

  window.addEventListener('resize', function(){ kline.resize(); radar.resize(); });
})();
</script>
</body>
</html>
